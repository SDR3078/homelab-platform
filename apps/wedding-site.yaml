# wedding-site — Anna & Sander wedding site (Next.js + Postgres)
#
# Deploys the chart from the tenant repo:
#   https://github.com/SDR3078/wedding-site/tree/main/helm
#
# CI/CD pipeline: every push to main in the tenant repo triggers a
# GitHub Actions workflow that builds the image, pushes to
# ghcr.io/sdr3078/wedding-site:<sha>, and bump-commits the new tag into
# helm/values.yaml in the tenant repo. ArgoCD detects that values change
# and rolls a new pod here. Image pulls require the 'ghcr-pull' Secret
# in this namespace, materialized by apps/wedding-site-bootstrap.yaml.
#
# Cross-repo source — first ArgoCD Application in this repo pointing at
# a different GitHub repository. The repo is PRIVATE — ArgoCD authenticates
# via the wedding-site-repo credential in charts/argocd/wedding-site-repo-sealed.yaml.
# The point of the decoupling: the wedding-site can iterate on app code
# (CSS, content, schema) without touching this repo, and platform
# changes don't force a chart re-render.
#
# Production settings live below in spec.source.helm.values, not in the
# tenant repo: this cluster's wiring (hosts and TLS, the public origin, the
# database, network-policy selectors, the pull secret, WAHA's database,
# resource sizes) and the switches you operate (sending on/off and its mode
# per channel, the From address, pacing, WhatsApp's limits). The tenant
# chart keeps what moves with its code (the image tag CI bumps, the
# rollback levers, WAHA's image and privacy settings) and ships safe
# defaults: sending off and dry-run, and no cluster wiring at all, so it
# refuses to render without this file. Change a setting with a commit here;
# the root app syncs it. This repo is public: personal data (the WhatsApp
# numbers, any allowlist) is sealed instead
# (charts/wedding-site/wedding-site-whatsapp-sealed.yaml).
#
# Sync-wave 1 — runs after apps/wedding-site-bootstrap.yaml (wave 0)
# which provides the namespace + sealed secrets the chart's pods depend
# on (envFrom + imagePullSecrets). On a clean cluster a brief
# CreateContainerConfigError on first pod schedule is expected and
# self-heals as soon as the wave-0 Application finishes decrypting.
#
# Bootstrap procedure (from-scratch deploy of this app onto the
# platform): see docs/rebuild.md Step 11, which delegates to
# charts/wedding-site/namespace.yaml's database-provisioning runbook
# and the runbooks on each *-sealed.yaml.
# Tenant-side generic deploy guide:
#   https://github.com/SDR3078/wedding-site/blob/main/deploy/README.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wedding-site
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/SDR3078/wedding-site.git
    targetRevision: main
    path: helm
    helm:
      releaseName: wedding-site
      # Overrides the chart's defaults key by key (maps merge; lists, such as
      # pullSecrets, replace). The tenant repo's helm/values.yaml documents
      # each setting; what lives there and what lives here is in its
      # deploy/README.md, "Settings". The chart refuses to render without the
      # cluster wiring below.
      values: |
        # ── Cluster wiring ──────────────────────────────────────────────
        image:
          pullSecrets:
            - name: ghcr-pull
        ingress:
          className: nginx
          # The LAN host (wildcard certificate) and the public host through
          # the external Cloudflare Tunnel (TLS ends at Cloudflare). Change
          # publicHost together with BETTER_AUTH_URL.
          host: wedding.lab.batzbak.top
          publicHost: anna-sander.wedding
          tls:
            enabled: true
            secretName: wildcard-lab-tls
        env:
          # The public origin: Better Auth's base URL and the base of every
          # personal invitation link.
          BETTER_AUTH_URL: "https://anna-sander.wedding"
        database:
          # The CNPG tenants cluster (charts/application-data).
          host: postgres-tenants-rw.application-data.svc.cluster.local
          port: 5432
          name: wedding
          credentialsSecret: wedding-credentials
          sslmode: require
        networkPolicy:
          database:
            namespace: application-data
            cnpgClusterName: postgres-tenants
            port: 5432
          dns:
            namespace: kube-system
            podSelector:
              k8s-app: kube-dns
        waha:
          # WhatsApp (WAHA) runs for the invitation campaign; false removes it
          # (its sessions stay in their databases).
          enabled: true
          database:
            credentialsSecret: waha-credentials
            name: waha
          # Measured during pairing (about 160Mi idle); the limit leaves room.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
        # ── Sizes ───────────────────────────────────────────────────────
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        migrations:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # ── The switches you operate ─────────────────────────────────────
        worker:
          env:
            # Email through Resend. dry-run renders and logs only; live sends
            # to every household an admin sends. Live since 2026-11-05.
            INVITES_MODE: "live"
            # Off unless exactly "true"; while off, queued sends wait.
            INVITES_ENABLED: "true"
            # ola@ forwards to Sander's inbox (Cloudflare Email Routing).
            INVITE_FROM: "Anna & Sander <ola@anna-sander.wedding>"
            INVITE_REPLY_TO: "ola@anna-sander.wedding"
            # At most one email every 5 s.
            INVITE_SEND_INTERVAL_MS: "5000"
            # WhatsApp from Anna's and Sander's own phones. The dry run worked
            # on 2026-11-06 (a real lookup, the message rendered); live since
            # then, with only test households in the database.
            INVITES_WHATSAPP_ENABLED: "true"
            INVITES_WHATSAPP_MODE: "live"
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
        whatsapp:
          # Per account in any 24 hours, failed attempts included. Start at
          # 10; raise towards 40 once a few days went well.
          dailyCap: 10
          # Minutes between two messages from one account, picked at random.
          gapMinutes: "8-15"
          # Hours messages may go out, in the guest's own time zone.
          window: "10-20"

  destination:
    server: https://kubernetes.default.svc
    namespace: wedding

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
