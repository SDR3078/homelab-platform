# Sealed Secrets controller
#
# Watches for SealedSecret custom resources, decrypts them using its
# private key, produces regular Kubernetes Secrets.
#
# The keypair is generated at first install and stored in a Secret in
# the sealed-secrets namespace. Back this up — losing it means all
# sealed secrets become unrecoverable.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Chart repo moved orgs (bitnami-labs -> bitnami); the old GitHub Pages URL now 404s, which is
    # what left this Application's sync status "Unknown" (ComparisonError: chart unfetchable). Same
    # chart 2.16.2 / appVersion 0.27.2, so ArgoCD reconciles to IDENTICAL manifests — the running
    # controller is not redeployed and the sealing keys (separate Secrets) are untouched.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.2
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
