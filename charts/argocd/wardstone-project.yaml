# wardstone AppProject — scopes the two wardstone Applications
# (apps/wardstone-bootstrap.yaml + apps/wardstone.yaml) onto a least-privilege
# project instead of the wide-open `default`, mirroring questsync-project.yaml.
#
# Applied by the argocd-config Application (apps/argocd-config.yaml, path
# charts/argocd) into the argocd namespace. Must exist in-cluster BEFORE the two
# Applications are synced with project: wardstone — push this project first.
#
# WIDER than questsync's project by exactly two kinds — core/PersistentVolumeClaim
# (the SQLite entitlement volume) and batch/CronJob (the daily reconcile job) —
# because wardstone is stateful where questsync was stateless. Also whitelists
# cert-manager.io/Certificate (the dedicated webhook-host cert) and
# bitnami.com/SealedSecret (wardstone-secrets + the private-image ghcr-pull).
# Allowlists are EXACT to what these apps deploy; adding a new kind to either
# chart requires adding it here too, or the sync is rejected.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wardstone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: WardStone — proprietary paid-access entitlement gate (bootstrap + workload apps)
  sourceRepos:
    - https://github.com/SDR3078/homelab-platform.git
    - https://github.com/SDR3078/wardstone.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: wardstone
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: cert-manager.io
      kind: Certificate
    - group: bitnami.com
      kind: SealedSecret
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim      # NEW vs questsync — the SQLite volume (stateful)
    - group: batch
      kind: CronJob                     # NEW vs questsync — the daily reconcile job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
