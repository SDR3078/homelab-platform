# batzbakbot AppProject — scopes the two batzbakbot Applications
# (charts/seasonal-apps/templates/batzbakbot-bootstrap.yaml + batzbakbot.yaml)
# onto a least-privilege project instead of the wide-open `default`, mirroring
# wardstone-project.yaml.
#
# This project is NOT gated by the seasonal-apps switchboard and must not be:
# argocd-config owns it, and it has to exist in-cluster before either Application
# is created. Parking batzbakbot leaves this behind deliberately, so un-parking
# does not depend on two Applications syncing in the right order.
#
# Applied by the argocd-config Application (apps/argocd-config.yaml, path
# charts/argocd) into the argocd namespace. Must exist in-cluster BEFORE the two
# Applications are synced with project: batzbakbot — push this project first.
#
# NARROWER than wardstone's project by one kind: no cert-manager.io/Certificate,
# because whatsapp.lab.batzbak.top falls inside the *.lab.batzbak.top wildcard
# and reuses the reflected wildcard-lab-tls rather than issuing its own.
#
# networking.k8s.io/Ingress IS whitelisted, for the bridge's management UI — but
# that API has NO authentication of its own, so the Ingress is gated by nginx
# basic auth (charts/batzbakbot/ingress.yaml + the whatsapp-basic-auth
# SealedSecret). Dropping that annotation publishes full control of the paired
# WhatsApp account to every address on the LAN.
#
# Carries core/PersistentVolumeClaim (bot state + the WhatsApp pairing) and
# networking.k8s.io/NetworkPolicy (a default-deny plus one allow, since that
# unauthenticated API would otherwise be reachable from all 30+ pods on the
# cluster). Allowlists are EXACT to what these two apps deploy; adding a kind to
# either side requires adding it here too, or the sync is rejected.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: batzbakbot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: BatzbakBot — Pukkelpop meetup ticket watcher + buyer (bootstrap + workload apps)
  sourceRepos:
    - https://github.com/SDR3078/homelab-platform.git
    - https://github.com/SDR3078/batzbakbot.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: batzbakbot
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: bitnami.com
      kind: SealedSecret
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
  orphanedResources:
    warn: true
