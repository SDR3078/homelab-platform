# batzbakbot AppProject — scopes the two batzbakbot Applications
# (apps/batzbakbot-bootstrap.yaml + apps/batzbakbot.yaml) onto a least-privilege
# project instead of the wide-open `default`, mirroring wardstone-project.yaml.
#
# Applied by the argocd-config Application (apps/argocd-config.yaml, path
# charts/argocd) into the argocd namespace. Must exist in-cluster BEFORE the two
# Applications are synced with project: batzbakbot — push this project first.
#
# NARROWER than wardstone's project: no cert-manager.io/Certificate and no
# networking.k8s.io/Ingress, because nothing here is exposed outside the cluster
# — the WhatsApp bridge API is unauthenticated and stays ClusterIP-internal.
# Carries core/PersistentVolumeClaim (bot state + the WhatsApp pairing) and
# networking.k8s.io/NetworkPolicy (a default-deny plus one allow, since that
# unauthenticated API would otherwise be reachable from all 30+ pods on the
# cluster). Allowlists are EXACT to what these two apps deploy; adding a kind to
# either side requires adding it here too, or the sync is rejected.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: batzbakbot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: BatzbakBot — Pukkelpop meetup ticket watcher + buyer (bootstrap + workload apps)
  sourceRepos:
    - https://github.com/SDR3078/homelab-platform.git
    - https://github.com/SDR3078/batzbakbot.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: batzbakbot
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: bitnami.com
      kind: SealedSecret
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
