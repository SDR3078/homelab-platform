# waha-credentials — the `waha` role of the postgres-tenants cluster
#
# WAHA (the WhatsApp HTTP API of the wedding site, phase 3) keeps its sessions
# in Postgres: it connects to the `waha` database for maintenance and creates
# its own databases (waha_wedding, waha_wedding_<session>), so the role has
# CREATEDB (managed.roles in postgres-tenants-cluster.yaml). Reflected into the
# `wedding` namespace for WAHA's WHATSAPP_SESSIONS_POSTGRESQL_URL.
#
# No password-manager entry: nothing but WAHA uses the password. If it's lost
# (or the sealed-secrets master key is), re-run the tenant repo's
# deploy/seal-waha-db.sh; CNPG sets the new password on the role. The password
# must stay alphanumeric (WAHA doesn't percent-decode it).
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: waha-credentials
  namespace: application-data
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: wedding
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: wedding
      name: waha-credentials
      namespace: application-data
    type: Opaque
