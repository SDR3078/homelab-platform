# wedding-site WhatsApp numbers (phase 3)
#
# WHATSAPP_NUMBER_ANNA and WHATSAPP_NUMBER_SANDER: Anna's and Sander's own
# WhatsApp numbers. The wedding site's admin page asks WAHA for a linking code
# for these numbers only, and the worker checks that each linked account is
# that phone. INVITES_WHATSAPP_ALLOWLIST: numbers for the worker's allowlist
# mode (may be empty). Personal data, so sealed rather than in the tenant
# repo's values. Read (optional) by the web pods and the worker; Reloader
# restarts them when it changes. Nothing to keep: on a rebuild, re-seal.
#
# Made by the tenant repo's deploy/seal-whatsapp.sh. By hand:
#   kubectl create secret generic wedding-site-whatsapp --namespace wedding \
#     --from-env-file=/dev/stdin --dry-run=client -o yaml <<'EOF' \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=sealed-secrets -o yaml
#   WHATSAPP_NUMBER_ANNA=+55 …
#   WHATSAPP_NUMBER_SANDER=+32 …
#   INVITES_WHATSAPP_ALLOWLIST=
#   EOF
# kubeseal doesn't write this header; re-prepend it when re-sealing.
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-site-whatsapp
  namespace: wedding
spec:
  encryptedData:
    INVITES_WHATSAPP_ALLOWLIST: 
    WHATSAPP_NUMBER_ANNA: 
    WHATSAPP_NUMBER_SANDER: 
  template:
    metadata:
      name: wedding-site-whatsapp
      namespace: wedding
