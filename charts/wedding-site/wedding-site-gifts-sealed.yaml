# wedding-site bank details for the Gifts page
#
# GIFTS_IBAN, GIFTS_ACCOUNT_NAME (the holder's exact name), GIFTS_BIC
# (optional): the bank transfer from Europe, with a European transfer QR code
# per gift. GIFTS_PIX_KEY, GIFTS_PIX_NAME, GIFTS_PIX_CITY: Pix from Brazil,
# with a Pix code per gift. Shown only to signed-in guests, never sent by
# email or WhatsApp. Personal data, so sealed rather than in the tenant
# repo's values. Read (optional) by the web pods; Reloader restarts them when
# it changes. Nothing to keep: on a rebuild, re-seal.
#
# Made by the tenant repo's deploy/seal-gifts.sh. By hand:
#   kubectl create secret generic wedding-site-gifts --namespace wedding \
#     --from-env-file=/dev/stdin --dry-run=client -o yaml <<'EOF' \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=sealed-secrets -o yaml
#   GIFTS_IBAN=…
#   GIFTS_ACCOUNT_NAME=…
#   GIFTS_PIX_KEY=…
#   GIFTS_PIX_NAME=…
#   EOF
# kubeseal doesn't write this header; re-prepend it when re-sealing.
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-site-gifts
  namespace: wedding
spec:
  encryptedData:
    GIFTS_ACCOUNT_NAME: 
    GIFTS_BIC: 
    GIFTS_IBAN: 
  template:
    metadata:
      name: wedding-site-gifts
      namespace: wedding
