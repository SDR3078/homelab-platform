# wedding-site invite-link secret
#
# Holds INVITE_TOKEN_SECRET, the HMAC key behind the wedding site's personal
# invite links (/i/<token>; src/lib/invite-token.ts in the tenant repo). The
# app checks every link against it, so changing it disables every link
# already sent, printed invitations included. The plaintext is in the
# password manager as 'homelab-platform/wedding-site-invite-token': on a
# rebuild, re-seal THAT value, never a new one. The Deployment requires this
# secret, and Reloader restarts the pod when it changes.
#
# Its own secret (not wedding-site-app): re-sealing anything else must never
# risk changing this value.
#
# Made by the tenant repo's deploy/seal-invite-token.sh. By hand:
#   S="$(openssl rand -base64 48)"   # or the password-manager value
#   printf '%s' "$S" | kubectl create secret generic \
#     wedding-site-invite-token --namespace wedding \
#     --from-file=INVITE_TOKEN_SECRET=/dev/stdin --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=sealed-secrets -o yaml
# kubeseal doesn't write this header; re-prepend it when re-sealing.
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-site-invite-token
  namespace: wedding
spec:
  encryptedData:
    INVITE_TOKEN_SECRET: 
  template:
    metadata:
      name: wedding-site-invite-token
      namespace: wedding
