# wedding-site Resend API key
#
# Holds RESEND_API_KEY, which the invitation worker sends the wedding site's
# emails with (src/worker/ in the tenant repo). A "Sending access" key
# restricted to anna-sander.wedding: it can send from that domain and nothing
# else, so a leaked copy can't read back the emails already sent. Nothing to
# keep: if it's lost, make a new key in Resend and re-seal; that breaks
# nothing. The worker reads it as an optional secret, and Reloader restarts
# the worker when it changes.
#
# Made by the tenant repo's deploy/seal-resend-key.sh. By hand:
#   read -rs KEY   # paste the key
#   printf '%s' "$KEY" | kubectl create secret generic \
#     wedding-site-resend --namespace wedding \
#     --from-file=RESEND_API_KEY=/dev/stdin --dry-run=client -o yaml \
#   | kubeseal --controller-name=sealed-secrets-controller \
#       --controller-namespace=sealed-secrets -o yaml
# kubeseal doesn't write this header; re-prepend it when re-sealing.
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-site-resend
  namespace: wedding
spec:
  encryptedData:
    RESEND_API_KEY: 
  template:
    metadata:
      name: wedding-site-resend
      namespace: wedding
