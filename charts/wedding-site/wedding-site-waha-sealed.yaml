# wedding-site WAHA admin key and dashboard login (phase 3, WhatsApp)
#
# Holds WAHA_API_KEY as sha512:<hash> (WAHA's entrypoint keeps a hashed value as
# is), WAHA_DASHBOARD_USERNAME and WAHA_DASHBOARD_PASSWORD. Read by the WAHA pod
# only (required). The plain admin key and the dashboard password are in the
# password manager as 'homelab-platform/wedding-site-waha-admin-key' and
# 'homelab-platform/wedding-site-waha-dashboard'; on a rebuild re-seal THOSE
# values (or make new ones with the tenant repo's deploy/seal-waha.sh: the
# sessions don't depend on them).
# ────────────────────────────────────────────────────────────────────────
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-site-waha
  namespace: wedding
spec:
  encryptedData:
    WAHA_API_KEY: 
    WAHA_DASHBOARD_PASSWORD: 
    WAHA_DASHBOARD_USERNAME: 
  template:
    metadata:
      name: wedding-site-waha
      namespace: wedding
    type: Opaque
