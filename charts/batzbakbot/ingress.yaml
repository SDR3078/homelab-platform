# WhatsApp bridge management UI at https://whatsapp.lab.batzbak.top
#
# Exists so pairing does not need `kubectl port-forward`. Same shape as
# charts/argocd/ingress.yaml: ingress-nginx terminates TLS with the reflected
# wildcard-lab-tls Secret (batzbakbot was added to the reflection lists in
# charts/cert-manager/certificate-wildcard.yaml).
#
# BASIC AUTH IS NOT OPTIONAL HERE, and this is the one thing to understand
# before touching this file. ArgoCD's UI is safe on this domain because ArgoCD
# has a login. This API has NONE: /send/message, /send/image, the chat list and
# the pairing UI are all unauthenticated, so reaching the host at all is full
# control of the paired WhatsApp account. lab.batzbak.top resolves on the LAN
# (192.168.68.50) and the host sits on a /22, so publishing it without auth
# would re-open exactly what compose commit c0158b2 closed -- that one was found
# by fetching the paired device's real name and phone number from another LAN
# address with plain curl, no exploit.
#
# The auth is at the EDGE, not in the app. The app does support -b user:pass,
# but the bot posts to /send/message over the ClusterIP Service with no
# credentials, so enabling it there would silently break every notification --
# including the payment QR for a ticket already reserved. In-cluster access is
# fenced separately by the NetworkPolicy in the app repo, which admits only the
# bot pod.
#
# whatsapp-basic-auth is produced by seal-secrets.sh (step 5/5).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp
  namespace: batzbakbot
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: whatsapp-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "batzbakbot whatsapp bridge"
    # The pairing QR is a PNG and the dashboard bundle is ~1 MB; the default
    # proxy buffers are fine, but the login endpoint can sit for the full QR
    # lifetime, so do not let nginx cut it shorter than the QR is valid.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: whatsapp.lab.batzbak.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whatsapp
                port:
                  number: 3000
  tls:
    - hosts:
        - whatsapp.lab.batzbak.top
      secretName: wildcard-lab-tls
---
# /favicon.ico WITHOUT basic auth, on the same host.
#
# Browsers fetch the favicon as a low-priority subresource and do NOT attach the
# Authorization header, so behind auth_basic every fetch 401s -- and each 401
# makes the browser re-prompt. Observed 2026-08-05: nine 401s on /favicon.ico
# while every real request (/devices, /app/info, the pairing POSTs) returned 200.
# The symptom reads as "it keeps asking for the password", which points at the
# credentials and is nothing to do with them.
#
# A separate Ingress rather than a snippet annotation: auth annotations apply per
# Ingress object, and configuration-snippet is disabled by default in
# ingress-nginx >= 1.9, so a snippet here would silently not apply.
#
# Exposes nothing: an icon on a path with no dynamic content. Exact match, so it
# is a prefix match on one filename, so it cannot shadow anything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp-favicon
  namespace: batzbakbot
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: whatsapp.lab.batzbak.top
      http:
        paths:
          - path: /favicon.ico
            # ImplementationSpecific, not Exact. ingress-nginx's admission
            # webhook rejects a dot in the path for Exact/Prefix -- it restricts
            # those to a safe character set -- and denied this outright:
            #   "path /favicon.ico cannot be used with pathType Exact"
            # The sync failed visibly rather than half-applying, which is the
            # webhook doing its job.
            pathType: ImplementationSpecific
            backend:
              service:
                name: whatsapp
                port:
                  number: 3000
  tls:
    - hosts:
        - whatsapp.lab.batzbak.top
      secretName: wildcard-lab-tls
