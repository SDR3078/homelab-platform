# batzbakbot namespace — watches the Pukkelpop meetup exchange and can buy a
# ticket (github.com/SDR3078/batzbakbot, PRIVATE).
#
# Platform glue owned in charts/batzbakbot (this ns + the three SealedSecrets);
# the workload (PVCs/Deployments/Service/NetworkPolicies) lives in the app repo's
# k8s/ Kustomize, deployed by the batzbakbot Application in
# charts/seasonal-apps (gated by that switchboard's `enabled` flag).
#
# NOTE this Namespace is what makes parking destructive: `enabled: false` prunes
# the bootstrap Application that owns it, and deleting a namespace deletes the
# PVCs inside it -- including the WhatsApp pairing. That is understood and
# accepted; `running: false` is the switch that pauses without deleting.
#
# One Ingress (ingress.yaml), no Certificate: whatsapp.lab.batzbak.top falls
# inside the *.lab.batzbak.top wildcard, so it reuses the reflected
# wildcard-lab-tls rather than issuing its own. batzbakbot was added to the
# reflection lists in charts/cert-manager/certificate-wildcard.yaml.
#
# That Ingress publishes the bridge's management UI so pairing does not need a
# port-forward — and it MUST keep its nginx basic-auth annotations. The API has
# NO authentication of its own: /send/message, /send/image, the chat list and the
# pairing UI are all open, so reaching the host at all is full control of the
# paired account. lab.batzbak.top resolves on the LAN, and the host sits on a
# /22. Compose commit c0158b2 closed exactly this hole once already, found by
# fetching the paired device's real name and phone from another LAN address with
# plain curl. The auth is at the edge rather than in the app because the bot
# posts to /send/message over the ClusterIP Service with no credentials, so the
# app's own -b flag would silently break every notification.
#
# PodSecurity 'restricted' is enforced and BOTH pods were verified against it:
#   - batzbakbot runs as uid 10001 (the image's own USER)
#   - whatsapp runs as uid 20001 (gowauser). Its image's entrypoint deliberately
#     starts as ROOT to mkdir/chown /app/storages + /app/statics before dropping
#     via su-exec, which 'restricted' forbids — forcing a non-root uid onto it
#     fails with "su-exec: setgroups: Operation not permitted" and the container
#     exits immediately. The app repo's manifest therefore bypasses the
#     entrypoint and lets Kubernetes do those two jobs (fsGroup + an emptyDir).
#     Verified end to end: device registered, pairing QR written.
apiVersion: v1
kind: Namespace
metadata:
  name: batzbakbot
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: batzbakbot
    app.kubernetes.io/part-of: homelab-platform
    app.kubernetes.io/managed-by: argocd

    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
